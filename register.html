<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب | English Academy</title>
  <link rel="stylesheet" href="style.css">

  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0b1120;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    .register-card {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      border: 1px solid #26364d;
      border-radius: 20px;
      background: #121b2e;
      box-shadow: 0 20px 60px #0005;
    }

    .logo {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 16px;
      background: #0891b2;
      font-size: 28px;
      font-weight: bold;
    }

    h1, .subtitle { text-align: center; }

    h1 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    .subtitle {
      margin-bottom: 28px;
      color: #94a3b8;
      line-height: 1.7;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #334155;
      border-radius: 10px;
      outline: none;
      background: #0b1120;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #06b6d4;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #06b6d4;
      color: #06202a;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      line-height: 1.7;
      font-size: 14px;
    }

    .links {
      margin-top: 22px;
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
    }

    a {
      color: #22d3ee;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="register-card">
    <div class="logo">E</div>

    <h1>إنشاء حساب جديد</h1>
    <p class="subtitle">
      انضم إلى English Academy وابدأ رحلة تعلم الإنجليزية.
    </p>

    <form id="registerForm">
      <label for="name">الاسم بالكامل</label>
      <input
        id="name"
        type="text"
        placeholder="اكتب اسمك"
        required
        maxlength="60"
      >

      <label for="email">البريد الإلكتروني</label>
      <input
        id="email"
        type="email"
        placeholder="example@email.com"
        required
      >

      <label for="password">كلمة المرور</label>
      <input
        id="password"
        type="password"
        placeholder="6 أحرف على الأقل"
        minlength="6"
        required
      >

      <label for="confirmPassword">تأكيد كلمة المرور</label>
      <input
        id="confirmPassword"
        type="password"
        placeholder="أعد كتابة كلمة المرور"
        minlength="6"
        required
      >

      <button id="submitButton" type="submit">
        إنشاء الحساب
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="links">
      لديك حساب بالفعل؟
      <a href="login.html">تسجيل الدخول</a>
      <br><br>
      <a href="index.html">العودة للرئيسية</a>
    </div>
  </main>

  <script type="module">
    import { auth, db } from "./firebase.js";

    import {
      createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (name.length < 2) {
        message.textContent = "من فضلك اكتب اسمًا صحيحًا.";
        message.style.color = "#f87171";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "كلمتا المرور غير متطابقتين.";
        message.style.color = "#f87171";
        return;
      }

      button.disabled = true;
      button.textContent = "جاري إنشاء الحساب...";
      message.textContent = "";

      try {
        const credential = await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        await updateProfile(credential.user, {
          displayName: name
        });

        await setDoc(doc(db, "users", credential.user.uid), {
          name: name,
          email: credential.user.email,
          role: "student",
          createdAt: serverTimestamp()
        });

        message.textContent =
          "تم إنشاء حسابك بنجاح! يمكنك الآن العودة إلى الرئيسية.";

        message.style.color = "#4ade80";
        form.reset();

      } catch (error) {
        console.error(error);

        const errors = {
          "auth/email-already-in-use": "هذا البريد مسجل بالفعل.",
          "auth/invalid-email": "البريد الإلكتروني غير صحيح.",
          "auth/weak-password": "كلمة المرور ضعيفة.",
          "permission-denied": "لا توجد صلاحية لحفظ بيانات الحساب."
        };

        message.textContent =
          errors[error.code] ||
          "حدث خطأ أثناء التسجيل. راجع بياناتك وحاول مرة أخرى.";

        message.style.color = "#f87171";

      } finally {
        button.disabled = false;
        button.textContent = "إنشاء الحساب";
      }
    });
  </script>
</body>
</html>
