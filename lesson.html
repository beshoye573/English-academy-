<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080f1e">
  <title>تفاصيل الدرس | English Academy</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080f1e;
      color: #f1f5f9;
    }

    header {
      background: #121b2e;
      border-bottom: 1px solid #263449;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    header strong { font-size: 19px; }

    a {
      color: #38bdf8;
      text-decoration: none;
    }

    main {
      width: min(900px, 90%);
      margin: 40px auto;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 22px;
    }

    .lesson-header,
    .lesson-content,
    .resources,
    .video-section {
      background: #121b2e;
      border: 1px solid #263449;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .lesson-number {
      color: #38bdf8;
      font-size: 14px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(25px, 5vw, 36px);
      margin: 0 0 15px;
    }

    .description {
      color: #94a3b8;
      line-height: 1.9;
    }

    .section-title {
      font-size: 21px;
      margin-top: 0;
      margin-bottom: 18px;
    }

    #lessonContent {
      color: #dbeafe;
      line-height: 2.1;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    .video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .resource-link {
      display: inline-block;
      margin: 5px 8px 5px 0;
      padding: 12px 18px;
      border-radius: 9px;
      background: #075985;
      color: white;
    }

    .resource-link:hover {
      background: #0284c7;
    }

    .message {
      background: #121b2e;
      border: 1px solid #263449;
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      color: #94a3b8;
      line-height: 1.8;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
    }

    @media (max-width: 600px) {
      main { margin: 25px auto; }

      .lesson-header,
      .lesson-content,
      .resources,
      .video-section {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <strong>English Academy</strong>
  <a href="dashboard.html">الصفحة الشخصية</a>
</header>

<main>

  <a id="backLink" href="course.html" class="back-link">
    ← العودة للوحدات
  </a>

  <div id="pageMessage" class="message">
    جارٍ تحميل الدرس...
  </div>

  <div id="lessonPage" hidden>

    <section class="lesson-header">
      <div class="lesson-number" id="lessonNumber"></div>
      <h1 id="lessonTitle"></h1>
      <p class="description" id="lessonDescription"></p>
    </section>

    <section class="video-section" id="videoSection" hidden>
      <h2 class="section-title">فيديو الدرس</h2>
      <div class="video-frame">
        <iframe
          id="youtubePlayer"
          title="فيديو شرح الدرس"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>
    </section>

    <section class="lesson-content">
      <h2 class="section-title">شرح الدرس</h2>
      <div id="lessonContent"></div>
    </section>

    <section class="resources" id="resources" hidden>
      <h2 class="section-title">ملفات الدرس</h2>
      <div id="resourceLinks"></div>
    </section>

  </div>

</main>

<footer>
  English Academy © 2026
</footer>

<script type="module">

  import { auth, db } from "./firebase.js";

  import {
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

  import { onAuthStateChanged } from
    "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


  const pageMessage = document.getElementById("pageMessage");
  const lessonPage = document.getElementById("lessonPage");

  const params = new URLSearchParams(window.location.search);
  const lessonId = params.get("lessonId");


  onAuthStateChanged(auth, async (user) => {

    if (!user) {
      window.location.replace("login.html");
      return;
    }

    if (!lessonId) {
      showMessage("لم يتم تحديد الدرس المطلوب.");
      return;
    }

    await loadLesson();

  });


  async function loadLesson() {

    try {

      const lessonRef = doc(db, "lessons", lessonId);
      const lessonSnapshot = await getDoc(lessonRef);

      if (!lessonSnapshot.exists()) {
        showMessage("هذا الدرس غير موجود أو تم حذفه.");
        return;
      }

      const lesson = lessonSnapshot.data();

      document.title =
        (lesson.title || "تفاصيل الدرس") + " | English Academy";

      document.getElementById("lessonTitle").textContent =
        lesson.title || "درس بدون عنوان";

      document.getElementById("lessonNumber").textContent =
        `الدرس رقم ${lesson.number || "—"}`;

      document.getElementById("lessonDescription").textContent =
        lesson.description || "";

      document.getElementById("lessonContent").textContent =
        lesson.content || "لم تتم إضافة شرح لهذا الدرس بعد.";

      const videoSection = document.getElementById("videoSection");
      const youtubePlayer = document.getElementById("youtubePlayer");

      if (lesson.videoUrl) {
        const embedUrl = getYouTubeEmbedUrl(lesson.videoUrl);

        if (embedUrl) {
          youtubePlayer.src = embedUrl;
          videoSection.hidden = false;
        }
      }

      const resources = document.getElementById("resources");
      const resourceLinks = document.getElementById("resourceLinks");

      resourceLinks.innerHTML = "";

      if (lesson.pdfUrl) {
        addResourceLink(
          resourceLinks,
          lesson.pdfUrl,
          "فتح ملف PDF"
        );
      }

      if (resourceLinks.children.length > 0) {
        resources.hidden = false;
      }

      if (lesson.unitId) {
        document.getElementById("backLink").href =
          `unit.html?unitId=${encodeURIComponent(lesson.unitId)}`;
      }

      pageMessage.hidden = true;
      lessonPage.hidden = false;

    } catch (error) {

      console.error("Lesson loading error:", error);

      showMessage(
        "حدث خطأ أثناء تحميل الدرس. تأكد من اتصال Firebase وصلاحيات Firestore."
      );

    }

  }


  function getYouTubeEmbedUrl(url) {

    try {

      const parsedUrl = new URL(url);
      let videoId = "";

      if (
        parsedUrl.hostname === "youtu.be" ||
        parsedUrl.hostname === "www.youtu.be"
      ) {
        videoId = parsedUrl.pathname.split("/").filter(Boolean)[0] || "";
      }

      else if (
        parsedUrl.hostname === "youtube.com" ||
        parsedUrl.hostname === "www.youtube.com" ||
        parsedUrl.hostname === "m.youtube.com"
      ) {

        if (parsedUrl.pathname === "/watch") {
          videoId = parsedUrl.searchParams.get("v") || "";
        }

        else if (
          parsedUrl.pathname.startsWith("/embed/") ||
          parsedUrl.pathname.startsWith("/shorts/")
        ) {
          videoId = parsedUrl.pathname.split("/")[2] || "";
        }

      }

      if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
        return null;
      }

      return `https://www.youtube-nocookie.com/embed/${videoId}`;

    } catch (error) {

      console.warn("Invalid YouTube URL:", error);
      return null;

    }

  }


  function addResourceLink(container, url, label) {

    try {

      const parsedUrl = new URL(url);

      if (!["https:", "http:"].includes(parsedUrl.protocol)) {
        return;
      }

      const link = document.createElement("a");

      link.href = parsedUrl.href;
      link.textContent = label;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.className = "resource-link";

      container.appendChild(link);

    } catch (error) {

      console.warn("Invalid resource URL:", error);

    }

  }


  function showMessage(message) {

    pageMessage.textContent = message;
    pageMessage.hidden = false;
    lessonPage.hidden = true;

  }

</script>

</body>
</html>
