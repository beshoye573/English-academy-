<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة التأسيس | English Academy</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .foundation-page {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .foundation-form, .foundation-card {
      background: var(--surface, #121b2e);
      border: 1px solid #26354d;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .foundation-form input,
    .foundation-form textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0 16px;
      border: 1px solid #34445e;
      border-radius: 8px;
      background: #0b1120;
      color: white;
      font: inherit;
    }

    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      margin: 4px;
    }

    .save-btn { background: #38bdf8; color: #07111e; }
    .edit-btn { background: #64748b; color: white; }
    .delete-btn { background: #dc4444; color: white; }

    .foundation-content {
      white-space: pre-wrap;
      line-height: 1.9;
    }

    .status { margin: 12px 0; }
  </style>
</head>

<body>
  <main class="foundation-page">
    <a href="admin.html">← العودة إلى لوحة الإدارة</a>

    <h1>إدارة Foundation</h1>
    <p>إضافة وإدارة دروس التأسيس في اللغة الإنجليزية.</p>

    <form class="foundation-form" id="foundationForm">
      <h2 id="formTitle">إضافة درس تأسيس جديد</h2>

      <label for="lessonTitle">عنوان الدرس</label>
      <input id="lessonTitle" required placeholder="مثال: الحروف الإنجليزية">

      <label for="lessonContent">شرح الدرس</label>
      <textarea id="lessonContent" rows="10" placeholder="اكتب محتوى الدرس هنا"></textarea>

      <label for="lessonExamples">الأمثلة والتدريبات</label>
      <textarea id="lessonExamples" rows="7" placeholder="أضف الأمثلة والتدريبات هنا"></textarea>

      <label for="lessonNotes">ملاحظات إضافية</label>
      <textarea id="lessonNotes" rows="4" placeholder="ملاحظات إضافية"></textarea>

      <button class="save-btn" type="submit">حفظ الدرس</button>
      <button class="edit-btn" type="button" id="cancelEdit" hidden>
        إلغاء التعديل
      </button>

      <p class="status" id="status"></p>
    </form>

    <h2>دروس التأسيس المضافة</h2>
    <div id="foundationList">جارٍ تحميل الدروس...</div>
  </main>

  <script type="module">
    import { auth, db } from "./firebase.js";

    import {
      collection,
      addDoc,
      getDocs,
      doc,
      updateDoc,
      deleteDoc,
      getDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const form = document.getElementById("foundationForm");
    const titleInput = document.getElementById("lessonTitle");
    const contentInput = document.getElementById("lessonContent");
    const examplesInput = document.getElementById("lessonExamples");
    const notesInput = document.getElementById("lessonNotes");
    const list = document.getElementById("foundationList");
    const status = document.getElementById("status");
    const cancelEdit = document.getElementById("cancelEdit");

    let editingId = null;

    onAuthStateChanged(auth, async user => {
      if (!user) {
        location.href = "login.html";
        return;
      }

      try {
        const profile = await getDoc(doc(db, "users", user.uid));

        if (!profile.exists() || profile.data().role !== "admin") {
          alert("هذه الصفحة مخصصة للأدمن فقط.");
          location.href = "index.html";
          return;
        }

        await loadLessons();

      } catch (error) {
        status.textContent =
          "حدث خطأ أثناء التحقق من الصلاحيات: " + error.message;
      }
    });

    async function loadLessons() {
      list.textContent = "جارٍ تحميل الدروس...";

      try {
        const snapshot = await getDocs(collection(db, "foundation"));

        list.replaceChildren();

        if (snapshot.empty) {
          list.textContent = "لا توجد دروس تأسيس مضافة حتى الآن.";
          return;
        }

        snapshot.forEach(item => {
          const data = item.data();

          const card = document.createElement("article");
          card.className = "foundation-card";

          const heading = document.createElement("h3");
          heading.textContent = data.title || "";

          const content = document.createElement("p");
          content.className = "foundation-content";
          content.textContent = data.content || "";

          const editButton = document.createElement("button");
          editButton.className = "edit-btn";
          editButton.textContent = "تعديل";
          editButton.addEventListener("click", () => {
            editLesson(item.id, data);
          });

          const deleteButton = document.createElement("button");
          deleteButton.className = "delete-btn";
          deleteButton.textContent = "حذف";
          deleteButton.addEventListener("click", () => {
            removeLesson(item.id);
          });

          card.append(heading, content, editButton, deleteButton);
          list.appendChild(card);
        });

      } catch (error) {
        list.textContent =
          "تعذر تحميل الدروس: " + error.message;
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const data = {
        title: titleInput.value.trim(),
        content: contentInput.value.trim(),
        examples: examplesInput.value.trim(),
        notes: notesInput.value.trim(),
        updatedAt: serverTimestamp()
      };

      if (!data.title) return;

      try {
        if (editingId) {
          await updateDoc(doc(db, "foundation", editingId), data);
          status.textContent = "تم تعديل الدرس بنجاح.";
        } else {
          await addDoc(collection(db, "foundation"), {
            ...data,
            createdAt: serverTimestamp()
          });

          status.textContent = "تمت إضافة الدرس بنجاح.";
        }

        resetForm();
        await loadLessons();

      } catch (error) {
        status.textContent =
          "حدث خطأ أثناء الحفظ: " + error.message;
      }
    });

    function editLesson(id, data) {
      editingId = id;

      titleInput.value = data.title || "";
      contentInput.value = data.content || "";
      examplesInput.value = data.examples || "";
      notesInput.value = data.notes || "";

      document.getElementById("formTitle").textContent = "تعديل درس التأسيس";
      cancelEdit.hidden = false;

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function removeLesson(id) {
      if (!confirm("هل أنت متأكد من حذف هذا الدرس؟")) return;

      try {
        await deleteDoc(doc(db, "foundation", id));
        status.textContent = "تم حذف الدرس بنجاح.";
        await loadLessons();

      } catch (error) {
        status.textContent = "تعذر الحذف: " + error.message;
      }
    }

    function resetForm() {
      form.reset();
      editingId = null;

      document.getElementById("formTitle").textContent =
        "إضافة درس تأسيس جديد";

      cancelEdit.hidden = true;
    }

    cancelEdit.addEventListener("click", resetForm);
  </script>
</body>
</html>
