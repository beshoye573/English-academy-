<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الوحدات | English Academy</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1120;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px 6%;
      background: #121b2e;
      border-bottom: 1px solid #26364d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    header h2 {
      margin: 0;
      color: #22d3ee;
    }

    a {
      color: #22d3ee;
      text-decoration: none;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .logout {
      background: #7f1d1d;
      color: white;
    }

    main {
      width: min(1100px, 92%);
      margin: 35px auto;
    }

    .page-heading {
      margin-bottom: 25px;
    }

    .page-heading p {
      color: #94a3b8;
      line-height: 1.7;
    }

    .panel {
      background: #121b2e;
      border: 1px solid #26364d;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .panel h2 {
      margin-top: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 15px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #334155;
      background: #0b1120;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #06b6d4;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .primary {
      background: #06b6d4;
      color: #06202a;
    }

    .secondary {
      background: #334155;
      color: white;
      margin-right: 8px;
    }

    .unit-list {
      display: grid;
      gap: 15px;
    }

    .unit-card {
      background: #0b1120;
      border: 1px solid #26364d;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .unit-info {
      flex: 1;
      min-width: 200px;
    }

    .unit-info h3 {
      margin: 0 0 10px;
      color: #22d3ee;
    }

    .unit-info p {
      color: #94a3b8;
      margin: 0;
      line-height: 1.6;
    }

    .unit-number {
      color: #cbd5e1;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .manage-lessons {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-radius: 9px;
      background: #164e63;
      color: #67e8f9;
      font-size: 14px;
      font-weight: bold;
    }

    .manage-lessons:hover {
      background: #155e75;
    }

    .edit {
      background: #1d4ed8;
      color: white;
    }

    .delete {
      background: #991b1b;
      color: white;
    }

    #message {
      margin: 15px 0;
      line-height: 1.7;
    }

    .empty {
      color: #94a3b8;
      text-align: center;
      padding: 25px;
    }

    @media (max-width: 650px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .panel {
        padding: 18px;
      }

      .unit-card {
        align-items: stretch;
      }

      .actions {
        width: 100%;
      }

      .actions > * {
        flex: 1;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <header>
    <h2>English Academy</h2>

    <div>
      <a href="admin.html">العودة للوحة الإدارة</a>
      <button class="logout" id="logoutButton">
        تسجيل الخروج
      </button>
    </div>
  </header>

  <main>

    <section class="page-heading">
      <h1>إدارة الوحدات الدراسية</h1>
      <p>
        أضف وحدات المنهج الدراسي أو عدّلها أو احذفها.
        يمكنك أيضًا فتح دروس كل وحدة وإدارتها بشكل مستقل.
      </p>
    </section>

    <div id="message" role="status" aria-live="polite"></div>

    <section class="panel">
      <h2 id="formTitle">إضافة وحدة جديدة</h2>

      <form id="unitForm">

        <div class="form-grid">

          <div class="field">
            <label for="unitNumber">رقم الوحدة</label>
            <input
              id="unitNumber"
              type="number"
              min="1"
              step="1"
              placeholder="مثال: 1"
              required
            >
          </div>

          <div class="field">
            <label for="unitTitle">اسم الوحدة</label>
            <input
              id="unitTitle"
              type="text"
              maxlength="150"
              placeholder="اكتب اسم الوحدة"
              required
            >
          </div>

          <div class="field full">
            <label for="unitDescription">وصف الوحدة</label>
            <textarea
              id="unitDescription"
              maxlength="1000"
              placeholder="اكتب وصفًا مختصرًا للوحدة..."
            ></textarea>
          </div>

        </div>

        <button class="primary" id="saveButton" type="submit">
          حفظ الوحدة
        </button>

        <button
          class="secondary"
          id="cancelButton"
          type="button"
          hidden
        >
          إلغاء التعديل
        </button>

      </form>
    </section>

    <section class="panel">
      <h2>الوحدات الموجودة</h2>

      <div id="unitList" class="unit-list">
        <p class="empty">جاري تحميل الوحدات...</p>
      </div>
    </section>

  </main>

  <script type="module">
    import { auth, db } from "./firebase.js";

    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
      collection,
      addDoc,
      getDocs,
      doc,
      getDoc,
      updateDoc,
      deleteDoc,
      query,
      where,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const form = document.getElementById("unitForm");
    const unitNumber = document.getElementById("unitNumber");
    const unitTitle = document.getElementById("unitTitle");
    const unitDescription = document.getElementById("unitDescription");
    const unitList = document.getElementById("unitList");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");
    const cancelButton = document.getElementById("cancelButton");
    const formTitle = document.getElementById("formTitle");

    let editingId = null;
    let currentUnits = [];
    let isAdmin = false;

    function showMessage(text, type = "success") {
      message.style.color =
        type === "success" ? "#4ade80" : "#f87171";

      message.textContent = text;
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function resetForm() {
      form.reset();
      editingId = null;
      formTitle.textContent = "إضافة وحدة جديدة";
      saveButton.textContent = "حفظ الوحدة";
      cancelButton.hidden = true;
    }

    async function loadUnits() {
      unitList.innerHTML =
        '<p class="empty">جاري تحميل الوحدات...</p>';

      try {
        const snapshot = await getDocs(
          collection(db, "units")
        );

        currentUnits = snapshot.docs.map(item => ({
          id: item.id,
          ...item.data()
        }));

        currentUnits.sort((a, b) =>
          Number(a.number) - Number(b.number)
        );

        renderUnits();

      } catch (error) {
        console.error(error);

        unitList.innerHTML =
          '<p class="empty">تعذر تحميل الوحدات. تحقق من اتصال Firebase والقواعد.</p>';
      }
    }

    function renderUnits() {
      if (currentUnits.length === 0) {
        unitList.innerHTML =
          '<p class="empty">لا توجد وحدات حتى الآن. أضف أول وحدة من النموذج بالأعلى.</p>';
        return;
      }

      unitList.innerHTML = currentUnits.map(unit => `
        <article class="unit-card">

          <div class="unit-info">
            <div class="unit-number">
              الوحدة رقم ${escapeHTML(unit.number)}
            </div>

            <h3>${escapeHTML(unit.title)}</h3>

            <p>
              ${escapeHTML(unit.description || "لا يوجد وصف لهذه الوحدة.")}
            </p>
          </div>

          <div class="actions">

            <a
              class="manage-lessons"
              href="lessons.html?unitId=${encodeURIComponent(unit.id)}"
            >
              📖 إدارة الدروس
            </a>

            <button
              class="edit"
              data-action="edit"
              data-id="${escapeHTML(unit.id)}"
            >
              تعديل
            </button>

            <button
              class="delete"
              data-action="delete"
              data-id="${escapeHTML(unit.id)}"
            >
              حذف
            </button>

          </div>

        </article>
      `).join("");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!isAdmin) {
        showMessage("ليس لديك صلاحية تنفيذ هذا الإجراء.", "error");
        return;
      }

      const number = Number(unitNumber.value);
      const title = unitTitle.value.trim();
      const description = unitDescription.value.trim();

      if (!Number.isInteger(number) || number < 1) {
        showMessage("اكتب رقم وحدة صحيحًا.", "error");
        return;
      }

      if (!title) {
        showMessage("اكتب اسم الوحدة.", "error");
        return;
      }

      const duplicate = currentUnits.some(unit =>
        Number(unit.number) === number && unit.id !== editingId
      );

      if (duplicate) {
        showMessage("رقم هذه الوحدة مستخدم بالفعل.", "error");
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "جاري الحفظ...";

      try {
        const unitData = {
          number,
          title,
          description,
          updatedAt: serverTimestamp()
        };

        if (editingId) {
          await updateDoc(
            doc(db, "units", editingId),
            unitData
          );

          showMessage("تم تعديل الوحدة بنجاح.");

        } else {
          await addDoc(
            collection(db, "units"),
            {
              ...unitData,
              createdAt: serverTimestamp()
            }
          );

          showMessage("تمت إضافة الوحدة بنجاح.");
        }

        resetForm();
        await loadUnits();

      } catch (error) {
        console.error(error);

        showMessage(
          "تعذر حفظ الوحدة. تأكد من صلاحيات الأدمن وقواعد Firestore.",
          "error"
        );

      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "حفظ الوحدة";
      }
    });

    unitList.addEventListener("click", async event => {
      const button = event.target.closest("button[data-action]");

      if (!button || !isAdmin) return;

      const id = button.dataset.id;
      const action = button.dataset.action;

      const unit = currentUnits.find(item => item.id === id);

      if (!unit) return;

      if (action === "edit") {
        editingId = id;

        unitNumber.value = unit.number;
        unitTitle.value = unit.title;
        unitDescription.value = unit.description || "";

        formTitle.textContent = "تعديل الوحدة";
        saveButton.textContent = "حفظ التعديلات";
        cancelButton.hidden = false;

        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      if (action === "delete") {
        const confirmed = confirm(
          `هل أنت متأكد من حذف الوحدة "${unit.title}"؟`
        );

        if (!confirmed) return;

        button.disabled = true;

        try {
          // التأكد من عدم وجود دروس مرتبطة بالوحدة
          const lessonsQuery = query(
            collection(db, "lessons"),
            where("unitId", "==", id)
          );

          const lessonsSnapshot = await getDocs(lessonsQuery);

          if (!lessonsSnapshot.empty) {
            showMessage(
              "لا يمكن حذف الوحدة لأنها تحتوي على دروس. احذف دروسها أولًا.",
              "error"
            );

            button.disabled = false;
            return;
          }

          await deleteDoc(doc(db, "units", id));

          if (editingId === id) resetForm();

          showMessage("تم حذف الوحدة بنجاح.");
          await loadUnits();

        } catch (error) {
          console.error(error);

          showMessage("تعذر حذف الوحدة.", "error");
          button.disabled = false;
        }
      }
    });

    cancelButton.addEventListener("click", resetForm);

    document.getElementById("logoutButton")
      .addEventListener("click", async () => {
        await signOut(auth);
        window.location.replace("login.html");
      });

    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.replace("login.html");
        return;
      }

      try {
        const userSnapshot = await getDoc(
          doc(db, "users", user.uid)
        );

        if (
          !userSnapshot.exists() ||
          userSnapshot.data().role !== "admin"
        ) {
          await signOut(auth);
          window.location.replace("login.html");
          return;
        }

        isAdmin = true;
        await loadUnits();

      } catch (error) {
        console.error(error);

        showMessage(
          "تعذر التحقق من صلاحيات الحساب. حاول مرة أخرى.",
          "error"
        );
      }
    });
  </script>

</body>
</html>
