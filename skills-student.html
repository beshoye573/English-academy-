<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills | English Academy</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .skills-page {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .skills-header {
      margin-bottom: 25px;
    }

    .skills-search {
      width: 100%;
      padding: 14px;
      margin: 15px 0 25px;
      border: 1px solid #34445e;
      border-radius: 10px;
      background: #121b2e;
      color: white;
      font: inherit;
    }

    .skill-card {
      background: var(--surface, #121b2e);
      border: 1px solid #26354d;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .skill-card h2 {
      color: #38bdf8;
      margin-top: 0;
    }

    .skill-content {
      white-space: pre-wrap;
      line-height: 1.9;
    }

    .skill-example {
      background: #0b1120;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      white-space: pre-wrap;
      line-height: 1.8;
    }

    .empty-message {
      text-align: center;
      padding: 30px;
      opacity: .8;
    }
  </style>
</head>

<body>
  <main class="skills-page">

    <a href="dashboard.html">← العودة إلى لوحة الطالب</a>

    <header class="skills-header">
      <h1>Skills</h1>
      <p>قسم المهارات – English Academy</p>
    </header>

    <input
      type="search"
      id="searchInput"
      class="skills-search"
      placeholder="ابحث عن مهارة..."
    >

    <div id="skillsList">
      جارٍ تحميل المهارات...
    </div>

  </main>

  <script type="module">
    import { auth, db } from "./firebase.js";

    import {
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const skillsList = document.getElementById("skillsList");
    const searchInput = document.getElementById("searchInput");

    let allSkills = [];

    onAuthStateChanged(auth, async user => {
      if (!user) {
        location.href = "login.html";
        return;
      }

      loadSkills();
    });

    async function loadSkills() {
      skillsList.textContent = "جارٍ تحميل المهارات...";

      try {
        const snapshot = await getDocs(collection(db, "skills"));

        allSkills = snapshot.docs.map(item => ({
          id: item.id,
          ...item.data()
        }));

        displaySkills(allSkills);

      } catch (error) {
        console.error(error);
        skillsList.textContent =
          "حدث خطأ أثناء تحميل المهارات: " + error.message;
      }
    }

    function displaySkills(skills) {
      skillsList.replaceChildren();

      if (skills.length === 0) {
        skillsList.innerHTML =
          '<p class="empty-message">لا توجد مهارات مضافة حتى الآن.</p>';
        return;
      }

      skills.forEach(skill => {
        const card = document.createElement("article");
        card.className = "skill-card";

        const title = document.createElement("h2");
        title.textContent = skill.title || "مهارة بدون عنوان";

        const description = document.createElement("div");
        description.className = "skill-content";
        description.textContent = skill.description || "";

        card.append(title, description);

        if (skill.example) {
          const example = document.createElement("div");
          example.className = "skill-example";
          example.textContent = skill.example;
          card.appendChild(example);
        }

        skillsList.appendChild(card);
      });
    }

    searchInput.addEventListener("input", () => {
      const query = searchInput.value.trim().toLowerCase();

      const filtered = allSkills.filter(skill => {
        return (
          (skill.title || "").toLowerCase().includes(query) ||
          (skill.description || "").toLowerCase().includes(query) ||
          (skill.example || "").toLowerCase().includes(query)
        );
      });

      displaySkills(filtered);
    });
  </script>
</body>
</html>
